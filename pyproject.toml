[project]
name = "ip6-agents"
version = "0.2.0"
description = "Multi-agent network administration with Pydantic AI agent delegation"
requires-python = ">=3.13"
dependencies = [
    "pydantic-ai-slim[openai,logfire,mcp,web]",
    "python-dotenv",
    "httpx",
    "logfire[httpx]>=4.29.0",
    "pyyaml",
    "fastmcp",
    "pandas>=3.0.3",
    "matplotlib>=3.9",
    "seaborn>=0.13",
]

[dependency-groups]
dev = [
    "pyarrow>=24.0.0",
]
