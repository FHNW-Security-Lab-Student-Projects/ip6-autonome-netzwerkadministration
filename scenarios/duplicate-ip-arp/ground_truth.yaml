root_cause: >
  router2's ARP/neighbor entry for 10.10.10.10 (client3) is bound to the WRONG MAC -- it
  points at client4's MAC instead of client3's real MAC. This is the aftermath of a
  duplicate-IP event on the VLAN30 segment: client4 (normally 10.10.10.11) also claimed
  10.10.10.10 and announced it while client3 was briefly off the segment, so router2 relearned
  the address to client4's MAC and won the binding. client4 then KEEPS 10.10.10.10 -- the
  duplicate address stays live on the segment and is NOT released, so client3 and client4 are
  both configured with 10.10.10.10 simultaneously and router2's poisoned binding persists.
  router2 is client3's gateway (ethernet-1/2.30 = 10.10.10.1), so it
  now frames all client3-bound traffic to client4's MAC. client4 owns that MAC and is live on
  the segment, so it answers for 10.10.10.10 -- which makes the symptom deceptive: a ping to
  10.10.10.10 still SUCCEEDS (client4 replies), yet the real service that runs on client3
  (http.server on TCP 1111) is unreachable, because client4 holds the address but does not run
  the service. The reportable symptom is therefore this mismatch -- 10.10.10.10 is pingable but
  client3's actual service is dead -- not a hard ping failure. The fault is STILL PRESENT
  during the investigation.

  Why live state alone is not enough: the poisoned MAC is client4's genuine, live MAC on
  the same segment, so a live `show arpnd arp-entries` shows a dynamic entry for 10.10.10.10
  that looks perfectly valid in isolation -- nothing in current state says "this MAC is
  wrong" and the binding is not in any device config. The decisive evidence is historical:
  SR Linux names the conflict in syslog (an `AddNbr Duplicate add 10.10.10.10,<mac>` event
  listing both competing MACs), and the SNAPSHOT HISTORY of router2's arp table corroborates
  it: 10.10.10.10 used to resolve to client3's REAL MAC and now resolves to client4's MAC.
  The recorded baseline is the only place the correct MAC itself is retained -- it is in
  neither the running config nor the live state. (The syslog visibility is why this scenario
  is classified medium rather than hard.)

  A correct answer identifies router2's ARP entry for 10.10.10.10 as bound to the wrong MAC
  (client4's MAC rather than client3's) and uses the syslog duplicate-address event and/or
  the recorded baseline to establish that the MAC changed -- recognising the duplicate-IP /
  ARP-poisoning nature on the VLAN30 segment.