root_cause: >
  Interface ethernet-1/3 (e1-3) on switch1 — the trunk uplink to router1 — is
  administratively disabled (oper-state down). This is the shared uplink that carries both
  VLAN10 (client1) and VLAN20 (client2) to their gateways on router1, so client1 and client2
  are both cut off from the rest of the network at once, while client3 (on switch2/router2)
  is unaffected. The two-clients-down-on-one-switch symptom points straight at the shared
  uplink. A correct answer names switch1 e1-3 (the trunk uplink to router1) as down.
