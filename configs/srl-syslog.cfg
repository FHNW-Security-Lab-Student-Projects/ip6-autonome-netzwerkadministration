# SR Linux startup config:
#   - forward syslog to Alloy (172.20.20.100:1514, UDP, RFC 5424)
#   - enable JSON-RPC management API on the mgmt network-instance (HTTP, port 80)
# Applied to every nokia_srlinux node in the topology.

enter candidate
set / system logging network-instance mgmt
set / system logging remote-server 172.20.20.100 transport udp
set / system logging remote-server 172.20.20.100 remote-port 1514
set / system logging remote-server 172.20.20.100 facility local6 priority match-above informational

set / system json-rpc-server admin-state enable
set / system json-rpc-server network-instance mgmt http admin-state enable
set / system json-rpc-server network-instance mgmt http use-authentication true
set / system json-rpc-server network-instance mgmt http session-limit 10
commit save
