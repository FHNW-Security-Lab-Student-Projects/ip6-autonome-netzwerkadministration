# SR Linux startup config -- switch1 (access switch)
#
# Baseline role: pure L2. Two broadcast domains carried as mac-vrf instances.
#   - e1-1: access (untagged) to client1   -> VLAN10
#   - e1-2: access (untagged) to client2   -> VLAN20
#   - e1-3: 802.1q trunk to router1, carries tagged VLAN10 + VLAN20
#
# Each VLAN is a mac-vrf network-instance that bridges the untagged access subif
# with the matching tagged subif on the trunk. L3 gateways live on router1.
#
# NOTE: comments must be ASCII and contain no quote chars (apostrophe, single/double quote, backtick) -- sr_cli source treats them as string delimiters and silently aborts the commit.

enter candidate

# --- syslog + JSON-RPC (do not remove) ---
set / system logging network-instance mgmt
set / system logging remote-server 172.20.20.100 transport udp
set / system logging remote-server 172.20.20.100 remote-port 1514
set / system logging remote-server 172.20.20.100 facility local6 priority match-above informational
set / system json-rpc-server admin-state enable
set / system json-rpc-server network-instance mgmt http admin-state enable
set / system json-rpc-server network-instance mgmt http use-authentication true
set / system json-rpc-server network-instance mgmt http session-limit 10

# --- e1-1: access port to client1 (untagged, VLAN10) ---
set / interface ethernet-1/1 admin-state enable
set / interface ethernet-1/1 subinterface 0 type bridged
set / interface ethernet-1/1 subinterface 0 admin-state enable

# --- e1-2: access port to client2 (untagged, VLAN20) ---
set / interface ethernet-1/2 admin-state enable
set / interface ethernet-1/2 subinterface 0 type bridged
set / interface ethernet-1/2 subinterface 0 admin-state enable

# --- e1-3: trunk to router1 (tagged VLAN10 + VLAN20) ---
set / interface ethernet-1/3 admin-state enable
set / interface ethernet-1/3 vlan-tagging true
set / interface ethernet-1/3 subinterface 10 type bridged
set / interface ethernet-1/3 subinterface 10 vlan encap single-tagged vlan-id 10
set / interface ethernet-1/3 subinterface 20 type bridged
set / interface ethernet-1/3 subinterface 20 vlan encap single-tagged vlan-id 20

# --- mac-vrf VLAN10: client1 <-> trunk ---
set / network-instance vlan10 type mac-vrf
set / network-instance vlan10 admin-state enable
set / network-instance vlan10 interface ethernet-1/1.0
set / network-instance vlan10 interface ethernet-1/3.10

# --- mac-vrf VLAN20: client2 <-> trunk ---
set / network-instance vlan20 type mac-vrf
set / network-instance vlan20 admin-state enable
set / network-instance vlan20 interface ethernet-1/2.0
set / network-instance vlan20 interface ethernet-1/3.20

commit save
