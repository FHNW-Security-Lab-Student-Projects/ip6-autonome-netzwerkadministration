name: testlab

topology:
  nodes:
    # Switches
    switch1:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:24.10.1
      type: ixr-d1
      labels:
        role: switch
        layer: access

    switch2:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:24.10.1
      type: ixr-d1
      labels:
        role: switch
        layer: access

    # Routers 
    router1:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:24.10.1
      type: ixr-d1
      labels:
        role: router
        layer: core

    router2:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:24.10.1
      type: ixr-d1
      labels:
        role: router
        layer: core

    # Network testing clients
    client1:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:latest
      labels:
        role: client
      exec:
        - ip addr add 192.168.1.10/24 dev eth1
        - ip route replace default via 192.168.1.1

    client2:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:latest
      labels:
        role: client
      exec:
        - ip addr add 192.168.10.10/24 dev eth1
        - ip route replace default via 192.168.10.1

    client3:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:latest
      labels:
        role: client
      exec:
        - ip addr add 10.10.10.10/24 dev eth1
        - ip route replace default via 10.10.10.1

  links:
    # Switch1 to clients
    - endpoints: ["switch1:e1-1", "client1:eth1"]
    - endpoints: ["switch1:e1-2", "client2:eth1"]

    # Switch1 uplink to router1
    - endpoints: ["switch1:e1-3", "router1:e1-1"]

    # Router1 to router2
    - endpoints: ["router1:e1-2", "router2:e1-1"]

    # Router2 to switch2
    - endpoints: ["router2:e1-2", "switch2:e1-1"]

    # Switch2 to client
    - endpoints: ["switch2:e1-2", "client3:eth1"]
