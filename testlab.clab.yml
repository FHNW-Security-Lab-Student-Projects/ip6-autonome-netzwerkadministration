name: testlab

mgmt:
  network: clab
  ipv4-subnet: 172.20.20.0/24

topology:
  nodes:
    # ── Monitoring stack ───────────────────────────────────────────────────────
    loki:
      kind: linux
      image: grafana/loki:3.0.0
      mgmt-ipv4: 172.20.20.101
      ports:
        - 3100:3100
      binds:
        - monitoring/loki/config.yml:/etc/loki/config.yml:ro
      cmd: -config.file=/etc/loki/config.yml

    alloy:
      kind: linux
      image: grafana/alloy:latest
      mgmt-ipv4: 172.20.20.100
      ports:
        - 12345:12345  # Alloy web UI
        - 1514:1514    # Syslog TCP receiver
      binds:
        - monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      cmd: run /etc/alloy/config.alloy

    grafana:
      kind: linux
      image: grafana/grafana:11.0.0
      mgmt-ipv4: 172.20.20.102
      ports:
        - 3000:3000    # Grafana UI → http://localhost:3000 (admin/admin)
      env:
        GF_AUTH_ANONYMOUS_ENABLED: "true"
        GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
        GF_AUTH_DISABLE_LOGIN_FORM: "false"
      binds:
        - monitoring/grafana/provisioning:/etc/grafana/provisioning:ro

    # ── Switches ───────────────────────────────────────────────────────────────
    switch1:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:24.10.1
      type: ixr-d1
      startup-config: configs/switch1.cfg
      labels:
        role: switch
        layer: access

    switch2:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:24.10.1
      type: ixr-d1
      startup-config: configs/switch2.cfg
      labels:
        role: switch
        layer: access

    # Routers
    router1:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:24.10.1
      type: ixr-d1
      startup-config: configs/router1.cfg
      labels:
        role: router
        layer: core

    router2:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:24.10.1
      type: ixr-d1
      startup-config: configs/router2.cfg
      labels:
        role: router
        layer: core

    # Network testing clients
    client1:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:latest
      labels:
        role: client
      exec:
        - ip addr add 192.168.1.10/24 dev eth1
        - ip route replace default via 192.168.1.1

    client2:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:latest
      labels:
        role: client
      exec:
        - ip addr add 192.168.10.10/24 dev eth1
        - ip route replace default via 192.168.10.1

    client3:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:latest
      labels:
        role: client
      exec:
        - ip addr add 10.10.10.10/24 dev eth1
        - ip route replace default via 10.10.10.1

    client4:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:latest
      labels:
        role: client
      exec:
        - ip addr add 10.10.10.11/24 dev eth1
        - ip route replace default via 10.10.10.1

  links:
    # Switch1 to clients
    - endpoints: ["switch1:e1-1", "client1:eth1"]
    - endpoints: ["switch1:e1-2", "client2:eth1"]

    # Switch1 uplink to router1
    - endpoints: ["switch1:e1-3", "router1:e1-1"]

    # Router1 to router2
    - endpoints: ["router1:e1-2", "router2:e1-1"]

    # Router2 to switch2
    - endpoints: ["router2:e1-2", "switch2:e1-1"]

    # Switch2 to clients
    - endpoints: ["switch2:e1-2", "client3:eth1"]
    - endpoints: ["switch2:e1-3", "client4:eth1"]
